{% load i18n %}
<div{% include "django/forms/widgets/attrs.html" %}>
  {% if widget.display_value %}
    <code>{{ widget.display_value }}</code>
  {% else %}
    <em>{% trans "Not set" %}</em>
  {% endif %}
  {% if widget.change_url %}
    &nbsp;<a class="button" href="{{ widget.change_url }}">{% if widget.display_value %}{% trans "Change" %}{% else %}{% trans "Set" %}{% endif %}</a>
  {% endif %}
</div>
