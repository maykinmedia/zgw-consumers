[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zgw-consumers"
version = "2.0.2"
description = "Configuration for service (OpenAPI 3 or other) consumers"
authors = [
    {name = "Maykin Media", email = "support@maykinmedia.nl"}
]
readme = "README.rst"
license = {file = "LICENSE"}
keywords = ["Django", "ZGW", "Common Ground", "VNG", "API", "OpenAPI", "OAS", "mTLS"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "django-relativedelta>=2.0.0",
    "django-solo",
    "django-privates>=4.0.2",
    "django-simple-certmanager>=4.0.0",
    "requests",
    "ape-pie",
    "typing_extensions>=4.5.0",
    "PyJWT>=2.0.2",
]

[project.urls]
Homepage = "https://github.com/maykinmedia/zgw-consumers"
Documentation = "https://zgw-consumers.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/maykinmedia/zgw-consumers/issues"
"Source Code" = "https://github.com/maykinmedia/zgw-consumers"
Changelog = "https://github.com/maykinmedia/zgw-consumers/blob/main/CHANGELOG.rst"

[project.optional-dependencies]
db = [
    "psycopg",
]
drf = [
    "djangorestframework",
]
oauth2 = ["requests-oauthlib"]
setup-configuration = [
    "django-setup-configuration>=0.6.0",
]
# These are not the test requirements! They are extras to be installed when making use of `zgw_consumers.test`
testutils = [
    "Faker>=0.7.0",
    "factory-boy",
]
tests = [
    "pytest",
    "pytest-django",
    "requests-mock",
    "pytest-cov",
    "freezegun",
    "tox",
    "ruff",
    "tabulate",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]
release = [
    "bump-my-version",
]

[tool.setuptools.packages.find]
include = ["zgw_consumers*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "testapp.settings"
markers = [
    "config_path: the path to the YAML file that is loaded for setup_configuration",
]

[tool.bumpversion]
current_version = "2.0.2"
files = [
    {filename = "pyproject.toml"},
    {filename = "README.rst"},
    {filename = "zgw_consumers/locale/nl/LC_MESSAGES/django.po"},
    {filename = "docs/conf.py"},
]

[tool.coverage.run]
branch = true
source = [
    "zgw_consumers"
]
omit = [
    "zgw_consumers/migrations/*",
]

[tool.coverage.report]
exclude_also = [
    "if (typing\\.)?TYPE_CHECKING:",
    "@(typing\\.)?overload",
    "class .*\\(.*Protocol.*\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "\\bpass$",
]
omit = [
    "zgw_consumers/migrations/*",
]

[tool.ruff.lint]
extend-select = [
    "UP",  # pyupgrade
    "DJ",  # django
    "LOG", # logging
    "G",
    "I",   # isort
    "E",   # pycodestyle
    "F",   # pyflakes
    "PERF",# perflint
    "B",   # flake8-bugbear
]

[tool.ruff.lint.isort]
combine-as-imports = true
section-order = [
    "future",
    "standard-library",
    "django",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"django" = ["django"]
