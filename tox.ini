[tox]
envlist =
    py{312,313}-django{52,60}
    isort
    black
    docs
skip_missing_interpreters = true

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
DJANGO =
    5.2: django52
    6.0: django60

[testenv]
setenv =
    DJANGO_SETTINGS_MODULE=testapp.settings
    PYTHONPATH = {toxinidir}
    PGPASSWORD =
passenv =
    PGPORT
    DB_USER
    DB_HOST
    DB_PASSWORD
extras =
    db
    drf
    testutils
    tests
    coverage
    setup-configuration
    oauth2
deps =
  django52: Django~=5.2.0
  django60: Django~=6.0.0
commands =
  pytest tests \
   --cov --cov-report xml:reports/coverage-{envname}.xml \
   {posargs}

[testenv:isort]
extras = tests
skipsdist = True
commands = isort --check-only --diff .

[testenv:black]
extras = tests
skipsdist = True
commands = black --check --diff zgw_consumers tests testapp

[testenv:docs]
basepython=python
changedir=docs
skipsdist=true
extras =
    testutils
    tests
    db
    drf
    docs
    setup-configuration
allowlist_externals = make
commands=
    make SPHINXOPTS="-W" html
    make linkcheck
